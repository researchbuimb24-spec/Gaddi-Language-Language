    <!-- Critical inline loader CSS - prevents FOUC -->
    <style>
      /* Critical loader styles - inline to prevent FOUC */
      #critical-loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }
      
      #critical-loader-wrapper.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      
      #critical-loader {
        bottom: 0;
        height: 175px;
        left: 50%;
        margin: 0 auto;
        position: absolute;
        width: 175px;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        -moz-transform: translate(-50%, -50%);
        -o-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      #critical-loader .dot {
        bottom: 0;
        height: 100%;
        left: 0;
        margin: auto;
        position: absolute;
        right: 0;
        top: 0;
        width: 87.5px;
      }
      
      #critical-loader .dot::before {
        border-radius: 100%;
        content: "";
        height: 87.5px;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        transform: scale(0);
        width: 87.5px;
      }
      
      #critical-loader .dot:nth-child(1) {
        transform: rotate(45deg);
      }
      
      #critical-loader .dot:nth-child(1)::before {
        animation: critical-load 0.8s linear 0.1s infinite;
        background: #d45552;
      }
      
      #critical-loader .dot:nth-child(2) {
        transform: rotate(90deg);
      }
      
      #critical-loader .dot:nth-child(2)::before {
        animation: critical-load 0.8s linear 0.2s infinite;
        background: #0a1a32;
      }
      
      #critical-loader .dot:nth-child(3) {
        transform: rotate(135deg);
      }
      
      #critical-loader .dot:nth-child(3)::before {
        animation: critical-load 0.8s linear 0.3s infinite;
        background: #28532e;
      }
      
      #critical-loader .dot:nth-child(4) {
        transform: rotate(180deg);
      }
      
      #critical-loader .dot:nth-child(4)::before {
        animation: critical-load 0.8s linear 0.4s infinite;
        background: #d45552;
      }
      
      #critical-loader .dot:nth-child(5) {
        transform: rotate(225deg);
      }
      
      #critical-loader .dot:nth-child(5)::before {
        animation: critical-load 0.8s linear 0.5s infinite;
        background: #0a1a32;
      }
      
      #critical-loader .dot:nth-child(6) {
        transform: rotate(270deg);
      }
      
      #critical-loader .dot:nth-child(6)::before {
        animation: critical-load 0.8s linear 0.6s infinite;
        background: #28532e;
      }
      
      #critical-loader .dot:nth-child(7) {
        transform: rotate(315deg);
      }
      
      #critical-loader .dot:nth-child(7)::before {
        animation: critical-load 0.8s linear 0.7s infinite;
        background: #d45552;
      }
      
      #critical-loader .dot:nth-child(8) {
        transform: rotate(360deg);
      }
      
      #critical-loader .dot:nth-child(8)::before {
        animation: critical-load 0.8s linear 0.8s infinite;
        background: #0a1a32;
      }
      
      @keyframes critical-load {
        100% {
          opacity: 0;
          transform: scale(1);
        }
      }
      /* Hide body content until loader is ready */
      body.loading {
        overflow: hidden;
      }

    <!-- Critical loader management script - executes immediately -->
    <script>
      (function() {
        'use strict';
        
        // Track loading state
        var loadingState = {
          domReady: false,
          stylesLoaded: false,
          fontsLoaded: false,
          scriptsLoaded: false,
          appReady: false
        };
        
        // Check if all resources are loaded
        function checkAllLoaded() {
          return loadingState.domReady && 
                 loadingState.stylesLoaded && 
                 loadingState.fontsLoaded && 
                 loadingState.scriptsLoaded && 
                 loadingState.appReady;
        }
        
        // Hide loader when everything is ready
        function hideLoader() {
          if (checkAllLoaded()) {
            var loader = document.getElementById('critical-loader-wrapper');
            if (loader) {
              loader.classList.add('hidden');
              document.body.classList.remove('loading');
              
              // Remove loader from DOM after transition
              setTimeout(function() {
                if (loader && loader.parentNode) {
                  loader.parentNode.removeChild(loader);
                }
              }, 300);
            }
          }
        }
        
        // Mark DOM as ready
        function markDomReady() {
          loadingState.domReady = true;
          hideLoader();
        }
        
        // Check if stylesheets are loaded
        function checkStylesLoaded() {
          // Wait a bit for stylesheets to be added to DOM
          setTimeout(function() {
            var stylesheets = document.querySelectorAll('link[rel="stylesheet"]');
            var loadedCount = 0;
            var totalCount = stylesheets.length;
            var checkedSheets = {};
            
            if (totalCount === 0) {
              loadingState.stylesLoaded = true;
              hideLoader();
              return;
            }
            
            // Check each stylesheet
            stylesheets.forEach(function(sheet, index) {
              var sheetId = sheet.href || index;
              
              // Check if already loaded
              try {
                if (sheet.sheet) {
                  loadedCount++;
                  checkedSheets[sheetId] = true;
                }
              } catch(e) {
                // Cross-origin stylesheet, assume loaded
                loadedCount++;
                checkedSheets[sheetId] = true;
              }
              
              // Listen for load event
              sheet.addEventListener('load', function() {
                if (!checkedSheets[sheetId]) {
                  checkedSheets[sheetId] = true;
                  loadedCount++;
                }
                if (loadedCount >= totalCount && !loadingState.stylesLoaded) {
                  loadingState.stylesLoaded = true;
                  hideLoader();
                }
              });
              
              sheet.addEventListener('error', function() {
                // Even on error, count as loaded to not block
                if (!checkedSheets[sheetId]) {
                  checkedSheets[sheetId] = true;
                  loadedCount++;
                }
                if (loadedCount >= totalCount && !loadingState.stylesLoaded) {
                  loadingState.stylesLoaded = true;
                  hideLoader();
                }
              });
            });
            
            // If all sheets already loaded
            if (loadedCount >= totalCount) {
              loadingState.stylesLoaded = true;
              hideLoader();
            }
            
            // Fallback: mark as loaded after a timeout
            setTimeout(function() {
              if (!loadingState.stylesLoaded) {
                loadingState.stylesLoaded = true;
                hideLoader();
              }
            }, 5000);
          }, 100);
        }
        
        // Check if fonts are loaded
        function checkFontsLoaded() {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function() {
              loadingState.fontsLoaded = true;
              hideLoader();
            }).catch(function() {
              // Fallback if font loading fails
              loadingState.fontsLoaded = true;
              hideLoader();
            });
          } else {
            // Fallback for browsers without Font Loading API
            setTimeout(function() {
              loadingState.fontsLoaded = true;
              hideLoader();
            }, 2000);
          }
        }
        
        // Check if critical scripts are loaded and Angular is bootstrapped
        function checkScriptsLoaded() {
          var checkCount = 0;
          var maxChecks = 100; // 10 seconds max (100 * 100ms)
          
          // Wait for Angular app to bootstrap
          var checkAppRoot = setInterval(function() {
            checkCount++;
            var appRoot = document.querySelector('app-root');
            
            // Check multiple indicators that Angular is ready:
            // 1. app-root has content (works for both SSR and CSR)
            // 2. Angular has set ng-version attribute on html element
            // 3. Angular has added _ngcontent or _nghost attributes
            var angularReady = false;
            
            if (appRoot) {
              // Check if Angular has bootstrapped by looking for Angular-specific attributes
              var htmlElement = document.documentElement;
              var hasNgVersion = htmlElement.hasAttribute('ng-version');
              var hasNgContent = appRoot.querySelector('[ng-version], [_ngcontent-c0], [_nghost-c0]');
              var hasContent = appRoot.innerHTML && appRoot.innerHTML.trim() !== '';
              
              // For SSR, content might already be there, so check for Angular hydration
              // For CSR, wait for content to appear
              if (hasNgVersion || hasNgContent || (hasContent && checkCount > 5)) {
                angularReady = true;
              }
            }
            
            if (angularReady || checkCount >= maxChecks) {
              clearInterval(checkAppRoot);
              loadingState.scriptsLoaded = true;
              loadingState.appReady = true;
              hideLoader();
            }
          }, 100);
        }
        
        // Initialize loading checks
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            markDomReady();
            checkStylesLoaded();
            checkFontsLoaded();
            checkScriptsLoaded();
          });
        } else {
          // DOM already ready
          markDomReady();
          checkStylesLoaded();
          checkFontsLoaded();
          checkScriptsLoaded();
        }
        
        // Also listen for window load event as backup
        window.addEventListener('load', function() {
          // Mark resources as loaded when window.load fires
          loadingState.stylesLoaded = true;
          loadingState.fontsLoaded = true;
          // Give Angular a moment to bootstrap after window load
          setTimeout(function() {
            loadingState.scriptsLoaded = true;
            loadingState.appReady = true;
            hideLoader();
          }, 500);
        });
        
        // Add loading class to body immediately to prevent content flash
        function addLoadingClass() {
          if (document.body) {
            document.body.classList.add('loading');
          }
        }
        
        // Try to add immediately
        if (document.body) {
          addLoadingClass();
        } else {
          // If body doesn't exist yet, wait for it
          var bodyCheck = setInterval(function() {
            if (document.body) {
              clearInterval(bodyCheck);
              addLoadingClass();
            }
          }, 10);
          
          // Fallback
          document.addEventListener('DOMContentLoaded', addLoadingClass);
        }
      })();
    </script>
